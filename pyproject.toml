[project]
name = "linguistic-maze"
version = "0.1.0"
description = "Игра-лабиринт для студентов-лингвистов"
authors = [
    {name = "FPL23", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pygame>=2.6.1",
    "transformers>=5.3.0",
    "torch>=2.10.0",
    "accelerate>=1.13.0",
    "mawo_pymorphy3>=1.0.4",
    "pylint (>=4.0.5,<5.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
