name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [ master ]

jobs:
  run-tests:
    name: Run tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Setup & run tests
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest
          pip install pygame
          cd src
          python -m pytest ../tests -v